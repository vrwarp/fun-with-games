version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      # One PR per ecosystem rather than a dozen: less review churn, and less
      # chance of two agents picking up overlapping dependency bumps.
      babylon:
        patterns: ['@babylonjs/*']
      tooling:
        patterns:
          - eslint*
          - '@eslint/*'
          - typescript-eslint
          - prettier*
          - typescript
          - vite
          - vitest
          - '@vitest/*'
          - '@playwright/*'

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
