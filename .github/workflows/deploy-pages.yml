name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never run two deployments at once, and never cancel one midway — a cancelled
# deploy can leave the live site on a half-published state.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build site
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v5

      - run: npm ci

      - name: Build
        # Pages serves the site from https://<owner>.github.io/<repo>/, so the
        # bundle needs a matching base path. `configure-pages` resolves the
        # right value, including for a custom domain (where it is just "/").
        env:
          BASE_PATH: ${{ steps.pages.outputs.base_path }}
        run: npm run build

      - name: Add SPA fallback
        # Pages returns its own 404 page for unknown paths. Serving the app
        # instead keeps deep links working if routing is ever added.
        run: cp dist/index.html dist/404.html

      - name: Disable Jekyll processing
        # Without this, Pages hides files and directories beginning with "_".
        run: touch dist/.nojekyll

      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
